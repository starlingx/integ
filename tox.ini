[tox]
envlist = linters,pylint,flake8,py39,coverage,bandit
minversion = 2.3
skipsdist = True
stxdir = {toxinidir}/..
ignore_basepython_conflict = True

[testenv]
basepython = python3
install_command = pip install -U \
  -c{env:UPPER_CONSTRAINTS_FILE:https://opendev.org/starlingx/root/raw/branch/master/build-tools/requirements/debian/upper-constraints.txt} \
  {opts} {packages}
setenv = VIRTUAL_ENV={envdir}
         OS_STDOUT_CAPTURE=1
         OS_STDERR_CAPTURE=1
         OS_TEST_TIMEOUT=60
deps = -r{toxinidir}/test-requirements.txt
allowlist_externals = bash

[testenv:linters]
# Ignore errors in included vendor code that we don't control.
#bashate ignore
#E006 Line too long
#E041 Arithmetic expansion using $[ is deprecated for $((
#E042 local declaration hides errors
#E043 Arithmetic compound has inconsistent return semantics
#E044 Use [[ for non-POSIX comparisions
commands =
  bash -c "find {toxinidir}          \
         -path {toxinidir}/kubernetes/plugins/isolcpus-device-plugin/files/vendor -prune -o \
         -path {toxinidir}/tools/kexec-tools/files -prune -o \
         -not \( -type d -name .?\* -prune \) \
         -type f                              \
         -not -name \*~                       \
         -not -name \*.md                     \
         -name \*.sh                          \
         -print0 | xargs -n 1 -0 bashate -v        \
         -i E006,E041,E042,E043,E044 -e E*"
# TODO (pynetlink):
# Remove the paths of pynetlink project from the exception list after upgrading to Linux 6.12 
# or higher, since these files will no longer be needed in the repository.
  bash -c "find {toxinidir}        \
            \(  -path {toxinidir}/.tox \)  -a -prune     \
            -o -path {toxinidir}/python/pynetlink/src/pynetlink/specs -prune \
            -o -path {toxinidir}/python/pynetlink/src/pynetlink/schemas -prune \
            -o -type f -name '*.yaml'       \
            -print0 | xargs -0 yamllint"

[testenv:pep8]
usedevelop = False
skip_install = True
deps =
    hacking
    flake8-bugbear<=19.3.0
    flake8<3.8.3
commands =
# TODO (pynetlink):
# Remove the pynetlink from the exception list after upgrading to Linux 6.12 or higher,
# since these files will no longer be needed in the repository.
    flake8 --extend-exclude {toxinidir}/python/pynetlink/src/pynetlink/base

[testenv:pylint]
deps = -r{toxinidir}/test-requirements.txt
       -e{[tox]stxdir}/config/sysinv/cgts-client/cgts-client
       pylint

# Currently only one python module with a setup.py file
commands = pylint --rcfile=./.pylintrc \
           tools/storage-topology/storage-topology/storage_topology

[testenv:venv]
commands = {posargs}

[testenv:docs]
deps = -r{toxinidir}/doc/requirements.txt
commands =
    rm -rf doc/build
    sphinx-build -a -E -W -d doc/build/doctrees -b html doc/source doc/build/html
allowlist_externals = rm

[testenv:releasenotes]
deps = -r{toxinidir}/doc/requirements.txt
commands =
    rm -rf releasenotes/build
    sphinx-build -a -E -W -d releasenotes/build/doctrees -b html releasenotes/source releasenotes/build/html
allowlist_externals =
    rm
    reno

[testenv:newnote]
# Re-use the releasenotes venv
envdir = {toxworkdir}/releasenotes
deps = -r{toxinidir}/doc/requirements.txt
commands = reno new {posargs}

[testenv:functional]
allowlist_externals = cat
commands = cat /etc/group

[flake8]
# E series are pep8
# E265 block comment should start with '# '
# E266 too many leading '#' for block comment
# E402 module level import not at top of file
# E501 line too long > 80
# E722 do not use bare except'
# E741 ambiguous variable name
# F series
# F504 '...' % ... has unused named argument(s):
# F509 '...' % ... has unsupported format character ','
# F841 local variable 'e' is assigned to but never used
# H series are hacking
# H101: Use TODO(NAME)
# H102 is apache license
# H104: File contains nothing but comments
# H201: no 'except:' at least use 'except Exception:'
# H238: old style class declaration, use new style
# H306: imports not in alphabetical order
# W series
# W291 trailing whitespace
# W391 blank line at end of file
# W503 line break before binary operator
# W504 line break after binary operator
# B series are from bugbear
# B001 Do not use bare `except:
# B007 Loop control variable 'cpu' not used within the loop body.
# B009 Do not call getattr with a constant attribute value
# B010 Do not call setattr with a constant attribute value
# F series
# F401 'module' imported but unused
# TODO(dharniss.gr): Fix these and re-enable
# B014: redundant exception types
# B017: assertRaises(Exception) too broad
# B042: exception __init__ missing super().__init__()
# E231: missing whitespace after comma
# E275: missing whitespace after keyword
ignore = E265,E266,E402,E501,E722,E741,B014,B017,B042,E231,E275
         F504,F509,F841,
         H101,H102,H104,H201,H238,H306,
         W291,W391,W503,W504
         B001,B007,B009,B010,
         F401

[testenv:coverage]
deps = -r{toxinidir}/test-requirements.txt
       pytest
       pytest-cov
       coverage
       jsonschema
       prettytable
allowlist_externals = bash
                      mkdir
                      cp
commands =
  mkdir -p {toxinidir}/UTCoverage
  bash -c "pytest {toxinidir}/tests/ {toxinidir}/python/pynetlink/src/pynetlink/tests/ \
    --cov={toxinidir}/python/pynetlink/src/pynetlink \
    --cov-config={toxinidir}/.coveragerc \
    --cov={toxinidir}/ceph/ceph/debian/bullseye/files \
    --cov={toxinidir}/tools/storage-topology/storage-topology/storage_topology \
    --cov={toxinidir}/kubernetes/kubernetes-unversioned/debian/all/deb_folder \
    --cov-report=term-missing \
    --cov-report=html:{toxinidir}/UTCoverage/htmlcov \
    --cov-report=xml:{toxinidir}/UTCoverage/coverage.xml \
    -v --tb=short 2>&1 | tee {toxinidir}/UTCoverage/coverage_report.txt"

[testenv:coverage-trixie]
basepython = {[trixie]basepython}
install_command = {[trixie]install_command}
setenv =
  {[testenv]setenv}
  UPPER_CONSTRAINTS_FILE=https://opendev.org/starlingx/root/raw/branch/master/build-tools/requirements/debian/trixie/upper-constraints.txt
  STX_DEBIAN_VARIANT=trixie
deps = pytest
       pytest-cov
       coverage
       jsonschema
       prettytable
       PyYAML
allowlist_externals = {[testenv]allowlist_externals}
                      mkdir
                      cp
commands =
  mkdir -p {toxinidir}/UTCoverage
  bash -c "pytest {toxinidir}/tests/ {toxinidir}/python/pynetlink/src/pynetlink/tests/ \
    --cov={toxinidir}/python/pynetlink/src/pynetlink \
    --cov-config={toxinidir}/.coveragerc \
    --cov={toxinidir}/ceph/ceph/debian/trixie/files \
    --cov={toxinidir}/tools/storage-topology/storage-topology/storage_topology \
    --cov={toxinidir}/kubernetes/kubernetes-unversioned/debian/all/deb_folder \
    --cov-report=term-missing \
    --cov-report=html:{toxinidir}/UTCoverage/htmlcov_trixie \
    --cov-report=xml:{toxinidir}/UTCoverage/coverage_trixie.xml \
    -v --tb=short 2>&1 | tee {toxinidir}/UTCoverage/coverage_trixie_report.txt"

# B108: hardcoded_tmp_directory
# B605: start_process_with_a_shell
[testenv:bandit]
deps = bandit
allowlist_externals = bash
                      mkdir
commands =
  mkdir -p {toxinidir}/UTCoverage
  bash -c "bandit --skip B108,B605 -r {toxinidir}/python/pynetlink/src/pynetlink \
    {toxinidir}/tools/storage-topology/storage-topology/storage_topology \
    {toxinidir}/ceph/ceph/debian/bullseye/files/ceph-manage-journal.py \
    -f txt -o {toxinidir}/UTCoverage/security_report.txt \
    --severity-level medium"
  bash -c "bandit --skip B108,B605 -r {toxinidir}/python/pynetlink/src/pynetlink \
    {toxinidir}/tools/storage-topology/storage-topology/storage_topology \
    {toxinidir}/ceph/ceph/debian/bullseye/files/ceph-manage-journal.py \
    -f json -o {toxinidir}/UTCoverage/bandit-report.json \
    --severity-level medium"

[testenv:coverage-cpp]
allowlist_externals = bash
                      mkdir
commands =
  bash {toxinidir}/tests/cpp/run_cpp_tests.sh

[testenv:coverage-go]
allowlist_externals = bash
                      go
commands =
  bash -c "cd {toxinidir}/kubernetes/plugins/isolcpus-device-plugin/files && \
    mkdir -p {toxinidir}/UTCoverage && \
    export GOPATH=/tmp/gopath GOCACHE=/tmp/gocache HOME=/tmp && \
    mkdir -p $GOPATH $GOCACHE && \
    GOFLAGS=-mod=vendor go test -v -coverprofile={toxinidir}/UTCoverage/coverage_go.out \
    . \
    ./kubernetes/pkg/kubelet/cm/cpuset/... \
    ./intel/intel-device-plugins-for-kubernetes/pkg/debug/... \
    ./intel/intel-device-plugins-for-kubernetes/pkg/deviceplugin/... \
    2>&1 | tee {toxinidir}/UTCoverage/coverage_go_report.txt && \
    go tool cover -func={toxinidir}/UTCoverage/coverage_go.out \
    2>&1 | tee -a {toxinidir}/UTCoverage/coverage_go_report.txt"

[trixie]
basepython = python3.13
install_command = pip install -U \
  -c{env:UPPER_CONSTRAINTS_FILE:https://opendev.org/starlingx/root/raw/branch/master/build-tools/requirements/debian/trixie/upper-constraints.txt} \
  {opts} {packages}
setenv =
  {[testenv]setenv}
  UPPER_CONSTRAINTS_FILE=https://opendev.org/starlingx/root/raw/branch/master/build-tools/requirements/debian/trixie/upper-constraints.txt
deps = -r{toxinidir}/test-requirements-trixie.txt

[testenv:pep8-trixie]
basepython = {[trixie]basepython}
install_command = {[trixie]install_command}
setenv = {[trixie]setenv}
usedevelop = False
skip_install = True
deps =
    hacking>=6.1.0
    flake8-bugbear
    flake8
commands =
    flake8 --extend-exclude {toxinidir}/python/pynetlink/src/pynetlink/base

[testenv:linters-trixie]
basepython = {[trixie]basepython}
install_command = {[trixie]install_command}
setenv = {[trixie]setenv}
deps = {[trixie]deps}
allowlist_externals = bash
commands =
  bash -c "find {toxinidir}          \
         -path {toxinidir}/kubernetes/plugins/isolcpus-device-plugin/files/vendor -prune -o \
         -path {toxinidir}/tools/kexec-tools/files -prune -o \
         -not \( -type d -name .?\* -prune \) \
         -type f                              \
         -not -name \*~                       \
         -not -name \*.md                     \
         -name \*.sh                          \
         -print0 | xargs -n 1 -0 bashate -v        \
         -i E006,E041,E042,E043,E044 -e E*"
  bash -c "find {toxinidir}        \
            \(  -path {toxinidir}/.tox \)  -a -prune     \
            -o -path {toxinidir}/python/pynetlink/src/pynetlink/specs -prune \
            -o -path {toxinidir}/python/pynetlink/src/pynetlink/schemas -prune \
            -o -type f -name '*.yaml'       \
            -print0 | xargs -0 yamllint"

[testenv:pylint-trixie]
basepython = {[trixie]basepython}
install_command = {[trixie]install_command}
setenv = {[trixie]setenv}
deps = {[trixie]deps}
       pylint
allowlist_externals = pip
commands =
  pip install --no-deps -e{[tox]stxdir}/config/sysinv/cgts-client/cgts-client
  pylint --rcfile=./.pylintrc \
           tools/storage-topology/storage-topology/storage_topology

