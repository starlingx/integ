    {toxinidir}/tools/storage-topology/storage-topology/storage_topology \
    {toxinidir}/ceph/ceph/debian/trixie/files/ceph-manage-journal.py \
    -f txt -o {toxinidir}/UTCoverage/security_trixie_report.txt \
    --severity-level medium"
  bash -c "bandit --skip B108,B605 -r {toxinidir}/python/pynetlink/src/pynetlink \
    {toxinidir}/tools/storage-topology/storage-topology/storage_topology \
    {toxinidir}/ceph/ceph/debian/trixie/files/ceph-manage-journal.py \
    -f json -o {toxinidir}/UTCoverage/bandit-trixie-report.json \
