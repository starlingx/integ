---
# MAINTAINER NOTE:
# This is a custom tzdata package that patches leap-seconds.list. Its version
# (debver) MUST stay >= the upstream tzdata version pulled by the mirror config
# in stx-tools/debian-mirror-tools/config/debian/trixie/common/base-trixie.lst.
# The repo merge selects the highest version, so whenever Debian trixie bumps
# tzdata in base-trixie.lst (e.g. 2026b -> 2026c), rebase this package to the
# same upstream version. The PKG_GITREVCOUNT-derived '.stx.N' suffix then makes
# the custom build outrank the identical upstream version. If left behind, the
# upstream package eclipses this one and the leap-seconds patch is dropped from
# the ISO.
debver: 2026c-0+deb13u1
dl_path:
  name: tzdata-debian-2026c-0+deb13u1.tar.gz
  url: https://salsa.debian.org/glibc-team/tzdata/-/archive/debian/2026c-0+deb13u1/tzdata-debian-2026c-0+deb13u1.tar.gz
  md5sum: f163292fd8907f1ea979ffb2479e2fed
  sha256sum: c06e55ab3e7de61d0b399b0a77df6946926b3c3163a2c7960c2e88bc200697e9
revision:
  dist: $STX_DIST
  PKG_GITREVCOUNT: true
